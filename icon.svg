<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7eb3"/>
      <stop offset="1" stop-color="#7b78ef"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0" stop-color="rgba(255,255,255,.55)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>
  <!-- 圆角粉色方块 -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- 高光 -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#shine)"/>
  <!-- 卡通猫头：圆形脸+双耳 -->
  <g transform="translate(256,260)" fill="#ffffff">
    <!-- 左耳 -->
    <path d="M-90,-90 L-60,-150 L-30,-95 Z"/>
    <!-- 右耳 -->
    <path d="M90,-90 L60,-150 L30,-95 Z"/>
    <!-- 脸 -->
    <circle r="115" cx="0" cy="0"/>
  </g>
  <!-- 脸部细节：眼睛、鼻子、腮红 -->
  <g transform="translate(256,260)">
    <circle cx="-32" cy="-15" r="9" fill="#2d2640"/>
    <circle cx="32" cy="-15" r="9" fill="#2d2640"/>
    <!-- 鼻 -->
    <path d="M-7,8 Q0,16 7,8 Q0,12 -7,8 Z" fill="#ff8db5"/>
    <!-- 微笑 -->
    <path d="M-20,25 Q0,42 20,25" stroke="#2d2640" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- 腮红 -->
    <circle cx="-55" cy="22" r="13" fill="#ffb3ce" opacity=".7"/>
    <circle cx="55" cy="22" r="13" fill="#ffb3ce" opacity=".7"/>
  </g>
  <!-- 头顶小花结 -->
  <g transform="translate(140,140)">
    <circle cx="0" cy="0" r="22" fill="#ffd966" stroke="#fff" stroke-width="4"/>
    <circle cx="22" cy="-12" r="14" fill="#ffd966" stroke="#fff" stroke-width="4"/>
    <circle cx="-12" cy="-22" r="14" fill="#ffd966" stroke="#fff" stroke-width="4"/>
    <circle cx="14" cy="14" r="14" fill="#ffd966" stroke="#fff" stroke-width="4"/>
    <circle cx="-16" cy="14" r="14" fill="#ffd966" stroke="#fff" stroke-width="4"/>
    <circle cx="0" cy="-4" r="8" fill="#ff7eb3"/>
  </g>
</svg>
